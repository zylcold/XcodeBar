name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish DMG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build DMG
        id: package
        run: |
          chmod +x scripts/package-dmg.sh
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_PATH="$(scripts/package-dmg.sh "$VERSION")"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "XcodeBar $GITHUB_REF_NAME" \
              --notes "Release build for $GITHUB_REF_NAME."

      - name: Upload DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.dmg_path }}" --clobber
